# Promptfoo evaluation config for mathos-formatting pipeline
# Evaluates the 3 highest-value prompts: step1, step3_processor, step6
#
# Usage:
#   cd skills/mathos-formatting/eval
#   promptfoo eval
#   promptfoo view

description: "MathOS Formatting Pipeline Evaluation"

# ─── Provider ───────────────────────────────────────────────────────────
providers:
  - id: openai:chat:deepseek-chat
    label: deepseek-chat
    config:
      apiBaseUrl: https://api.deepseek.com
      apiKeyEnvar: DEEPSEEK_API_KEY
      temperature: 0
      max_tokens: 16384

# ─── Prompts ────────────────────────────────────────────────────────────
prompts:
  - id: file://../agents/step1_toc_detection_prompt.md
    label: step1_toc_detection
  - id: file://../agents/step3_heading_processor_prompt.md
    label: step3_heading_processor
  - id: file://../agents/step6_content_processor_prompt.md
    label: step6_content_processor

# ─── Default test settings ─────────────────────────────────────────────
defaultTest:
  options:
    provider:
      id: openai:chat:deepseek-chat
      config:
        apiBaseUrl: https://api.deepseek.com
        apiKeyEnvar: DEEPSEEK_API_KEY
        temperature: 0
        max_tokens: 16384

# ─── Test suites ────────────────────────────────────────────────────────
tests:
  # ── Step 1: TOC Detection ──────────────────────────────────────────────
  - description: "Step 1 – TOC extraction from numbered Markdown (book1)"
    vars:
      input: file://fixtures/book1/input_step1.md
    assert:
      - type: python
        value: file://assertions/toc_valid.py
      # Golden-output similarity check
      - type: similar
        value: file://fixtures/book1/golden_step1.md
        threshold: 0.8

  # ── Step 3: Heading Processor ──────────────────────────────────────────
  - description: "Step 3 – Heading processor Python script (book1)"
    vars:
      input: file://fixtures/book1/input_step3.md
    assert:
      - type: python
        value: file://assertions/python_artifact_valid.py
        config:
          step: step3
      # Must contain TOC_HEADINGS dict
      - type: contains
        value: "TOC_HEADINGS"
      - type: contains
        value: "def replace_in_file"
      - type: contains
        value: "def main"

  # ── Step 6: Content Processor ──────────────────────────────────────────
  - description: "Step 6 – Content processor Python script (book1)"
    vars:
      input: file://fixtures/book1/input_step6.md
    assert:
      - type: python
        value: file://assertions/python_artifact_valid.py
        config:
          step: step6
      - type: contains
        value: "def protect_blocks"
      - type: contains
        value: "def restore_blocks"
      - type: contains
        value: "def main"
      # Must not touch H1-H3
      - type: not-contains
        value: "# 第一章"

  # ── Additional test: Step 3 expected result (bonus) ────────────────────
  # Uncomment when fixtures/book1/input_step3_expected.md is populated
  # - description: "Step 3 expected – Heading list from TOC (book1)"
  #   vars:
  #     input: file://fixtures/book1/input_step3_expected.md
  #   assert:
  #     - type: python
  #       value: file://assertions/heading_structure_valid.py

  # ── Additional test: Step 5 heading validation (bonus) ─────────────────
