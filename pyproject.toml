[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathematics-knowledge-tools"
version = "0.1.0"
description = "Codex-ready automation tools for a secondary-school mathematics knowledge base."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "PyMuPDF>=1.23.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
math-knowledge = "mathos.cli:main"
mk-format = "mathos.formatter.cli:main"
mk-mineru = "mathos.ingestion.mineru.cli:main"
mk-vault = "mathos.vault.cli:main"
mk-extract = "mathos.extraction.cli:main"
mk-graph = "mathos.projection.graph_backend.cli:main"
mk-obsidian = "mathos.obsidian_integration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
