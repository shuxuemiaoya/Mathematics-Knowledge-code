[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathematics-knowledge-tools"
version = "0.1.0"
description = "Codex-ready automation tools for a secondary-school mathematics knowledge base."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "PyMuPDF>=1.23.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
math-knowledge = "math_knowledge_tools.cli:main"
mk-format = "math_knowledge_tools.md_formatter.cli:main"
mk-mineru = "math_knowledge_tools.mineru.cli:main"
mk-vault = "math_knowledge_tools.parser.cli:main"
mk-extract = "math_knowledge_tools.ontology.cli:main"
mk-graph = "math_knowledge_tools.graph_backend.cli:main"
mk-obsidian = "math_knowledge_tools.obsidian_integration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
